openapi: 3.1.0
info:
  title: FlowRiver Administrator API
  version: 1.0.0
  description: >-
    Private, same-origin API for the FlowRiver management console. Administrator sessions use an HttpOnly host-only cookie and a matching CSRF token.
servers:
  - url: https://admin.flowriver.xyz/admin-api/v1
security:
  - administratorSession: []
paths:
  /users/summary:
    get:
      summary: Database-wide user counts for total, active, disabled, passwords, seven-day activity and currently valid premium entitlements
      responses:
        '200': { description: Counts and an update timestamp. }
        '401': { description: Administrator authentication required. }
  /users/{id}/activity:
    get:
      summary: Recent 100 account and administrator activities scoped to a user and their devices
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Scoped events. }
        '401': { description: Administrator authentication required. }
        '404': { description: User not found. }

  /users/{id}/password/reset:
    post:
      summary: Reset a verified-email user's password
      description: Requires an authenticated administrator, same-origin CSRF verification and recent MFA. Accepts a new 15–128 Unicode character NFC-normalized password, never exposes stored hashes, revokes all user sessions and increments the credential version to invalidate old reset proofs. Writes an audit event in the same transaction.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password, reason_code]
              properties:
                new_password: { type: string, minLength: 15, maxLength: 128 }
                reason_code: { type: string, enum: [user_request, suspicious_activity, other] }
      responses:
        '200':
          description: Password reset, with no credential returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { const: password_reset }
                  user_id: { type: string, format: uuid }
                  revoked_sessions: { type: integer }
        '400': { description: Invalid request or password policy. }
        '401': { description: Administrator authentication required. }
        '403': { description: CSRF rejected or recent MFA required. }
        '404': { description: User not found. }
        '409': { description: Active verified email required or idempotency key reused. }
        '429': { description: Password computation capacity reached. }

  /auth/session:
    get:
      security: []
      responses:
        '200': { description: Current session state or one-time administrator setup requirement }
        '503': { $ref: '#/components/responses/Unavailable' }
  /auth/login:
    post:
      security: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, minLength: 3, maxLength: 64 }
                password: { type: string, minLength: 12, maxLength: 128 }
      responses:
        '200': { description: Password accepted; short-lived TOTP challenge returned }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/Throttled' }
  /auth/mfa:
    post:
      security: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge, code]
              properties:
                challenge: { type: string, minLength: 32, maxLength: 128 }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200': { description: TOTP accepted once; administrator and CSRF cookies set }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/Throttled' }
  /auth/logout:
    post:
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '200': { description: Session revoked and cookies cleared }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/reauthenticate:
    post:
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties:
                password: { type: string, minLength: 12, maxLength: 128 }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200': { description: Five-minute step-up window opened }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/change-password:
    post:
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, minLength: 12, maxLength: 128 }
                new_password: { type: string, minLength: 12, maxLength: 128 }
      responses:
        '200': { description: Password updated; other administrator sessions revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /overview:
    get:
      responses:
        '200': { description: Current account, session, mail-queue and security-queue counts }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users:
    get:
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Complete email address or complete user UUID only }
        - { name: status, in: query, schema: { type: string, enum: [active, deleting, recovery_required] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200': { description: Masked email list and bounded page }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users/{id}:
    get:
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Identity, full email and consent history; access is written to the administrator audit log }
        '404': { description: User does not exist }
  /devices:
    get:
      parameters:
        - { name: user_id, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200': { description: Device and valid-session metadata; email values are masked }
  /devices/{id}/revoke:
    post:
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason_code]
              properties:
                reason_code: { type: string, enum: [lost_device, user_request, suspicious_activity, other] }
      responses:
        '200': { description: Device sessions revoked transactionally and action audited }
        '403': { description: Recent password plus TOTP verification is required }
        '404': { description: Device does not exist }
        '409': { description: User cannot sign in, or request key reused with different details }
  /mail-jobs:
    get:
      responses:
        '200': { description: Bounded SMTP outbox metadata. OTP values and message bodies are never returned. }
  /security-events:
    get:
      responses:
        '200': { description: Account deletion, identity-removal and Apple-revocation off-host journal states }
  /audit:
    get:
      parameters:
        - { name: before, in: query, schema: { type: integer, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200': { description: Administrator action log, retained for 90 days }
  /operations:
    get:
      responses:
        '200': { description: API/database readiness, Linux memory/disk/load, backup state and manually recorded recovery exercise }
  /config-status:
    get:
      responses:
        '200': { description: Service dependency state and source-IP restriction status, without secret values }
  /activation/batches:
    get:
      responses:
        '200': { description: Recent activation batches and usage counts }
    post:
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, duration_days, count]
              properties:
                label: { type: string, minLength: 1, maxLength: 120 }
                product_code: { type: string, default: riverdiary_premium }
                duration_days: { type: integer, minimum: 0, maximum: 36500, description: Zero grants a permanent right. }
                expires_at: { type: [string, 'null'], format: date-time, description: Optional last time at which a code may be redeemed. }
                count: { type: integer, minimum: 1, maximum: 500 }
      responses:
        '201': { description: Batch and plaintext codes returned on the first request and encrypted for a 15-minute idempotent retry window; only keyed code digests remain afterward. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /activation/batches/import:
    post:
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, duration_days, codes]
              properties:
                label: { type: string, minLength: 1, maxLength: 120 }
                product_code: { type: string, default: riverdiary_premium }
                duration_days: { type: integer, minimum: 0, maximum: 36500 }
                expires_at: { type: [string, 'null'], format: date-time }
                codes: { type: array, minItems: 1, maxItems: 400, items: { type: string, minLength: 12, maxLength: 40 } }
      responses:
        '201': { description: Imported code batch created; code plaintext is not retained. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: A code already exists in another batch. }
        '403': { $ref: '#/components/responses/Forbidden' }
  /activation/codes:
    get:
      parameters:
        - { name: batch_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Recent codes with masked suffixes and redemption status only. }
  /activation/codes/{id}:
    delete:
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '200': { description: Unused code revoked and audit recorded. }
        '404': { description: Code does not exist. }
        '409': { description: Redeemed code cannot be deleted. }
        '403': { $ref: '#/components/responses/Forbidden' }
  /operations/restore-drill:
    post:
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result: { type: string, enum: [success, failure] }
      responses:
        '201': { description: Administrator's report recorded; this endpoint does not run a restore }
        '403': { description: Recent password plus TOTP verification is required }
  /announcements:
    get: { summary: List announcements (max 200 newest), responses: { '200': { description: OK } } }
    post:
      summary: Create announcement (step-up required)
      requestBody: { content: { application/json: { schema: { type: object, required: [level, title], properties: { level: { type: string, enum: [info, warn, critical] }, title: { type: string }, body: { type: string }, placement: { type: string, enum: [banner, download, both] }, href: { type: string }, active: { type: boolean }, starts_at: { type: string, format: date-time, nullable: true }, ends_at: { type: string, format: date-time, nullable: true } } } } } }
      responses: { '201': { description: Created } }
  /announcements/{id}:
    post: { summary: Update announcement (step-up required), responses: { '200': { description: OK } } }
    delete: { summary: Delete announcement (step-up required), responses: { '200': { description: Deleted } } }
  /announcements/{id}/activate:
    post: { summary: Publish announcement (step-up required), responses: { '200': { description: OK } } }
  /announcements/{id}/deactivate:
    post: { summary: Unpublish announcement (step-up required), responses: { '200': { description: OK } } }
  /downloads:
    get: { summary: List download artifacts, responses: { '200': { description: OK } } }
    post:
      summary: Upload installer artifact (multipart/form-data, step-up required)
      requestBody: { content: { multipart/form-data: { schema: { type: object, properties: { platform: { type: string, enum: [macos, ios] }, version: { type: string }, note: { type: string }, file: { type: string, format: binary } } } } } }
      responses: { '201': { description: Created }, '409': { description: Filename exists } }
  /downloads/{id}/activate:
    post: { summary: Publish artifact for its platform (step-up required), responses: { '200': { description: OK } } }
  /downloads/{id}/deactivate:
    post: { summary: Suspend artifact downloads (step-up required), responses: { '200': { description: OK } } }
  /downloads/{id}/note:
    post: { summary: Update artifact note (step-up required), responses: { '200': { description: OK } } }
  /users/{id}/disable:
    post: { summary: Disable user account and revoke sessions (step-up required), responses: { '200': { description: OK } } }
  /users/{id}/enable:
    post: { summary: Re-enable user account (step-up required), responses: { '200': { description: OK } } }
  /users/{id}/force-logout:
    post: { summary: Revoke all user sessions (step-up required), responses: { '200': { description: OK } } }
  /users/{id}/sessions:
    get: { summary: List user sessions (max 200 newest), responses: { '200': { description: OK } } }
  /users/{id}/sessions/{sid}/revoke:
    post: { summary: Revoke one user session (step-up required), responses: { '200': { description: OK } } }
  /users/{id}/entitlements:
    post:
      summary: Grant or extend an entitlement directly (step-up required)
      requestBody: { content: { application/json: { schema: { type: object, required: [reason_code], properties: { product_code: { type: string }, duration_days: { type: integer }, reason_code: { type: string } } } } } }
      responses: { '200': { description: OK } }
  /users/{id}/entitlements/{product}:
    delete: { summary: Revoke an entitlement (step-up required), responses: { '200': { description: OK } } }
  /admins:
    get: { summary: List administrator accounts, responses: { '200': { description: OK } } }
    post:
      summary: Create administrator (step-up required; one-time TOTP URI returned)
      requestBody: { content: { application/json: { schema: { type: object, required: [username, password], properties: { username: { type: string }, password: { type: string } } } } } }
      responses: { '201': { description: Created }, '409': { description: Username exists } }
  /admins/{id}/disable:
    post: { summary: Disable administrator (step-up required), responses: { '200': { description: OK } } }
  /admins/{id}/enable:
    post: { summary: Enable administrator (step-up required), responses: { '200': { description: OK } } }
  /admins/{id}/totp-reset:
    post: { summary: Reset administrator TOTP (step-up required; one-time URI returned), responses: { '200': { description: OK } } }
  /admin-sessions:
    get: { summary: List active administrator sessions, responses: { '200': { description: OK } } }
  /admin-sessions/{id}/revoke:
    post: { summary: Revoke an administrator session (step-up required), responses: { '200': { description: OK } } }
  /stats:
    get:
      summary: Daily signup, redemption, and mail series plus live counts
      parameters: [{ name: days, in: query, schema: { type: integer, minimum: 7, maximum: 90, default: 30 } }]
      responses: { '200': { description: OK } }
  /ratelimits/top:
    get: { summary: List 50 most recent rate-limit buckets (HMAC-prefixed), responses: { '200': { description: OK } } }
  /ratelimits/lookup:
    post: { summary: Look up rate-limit state for an email or IP, responses: { '200': { description: OK } } }
  /ratelimits/clear:
    post: { summary: Clear one rate-limit bucket (step-up required, audited), responses: { '200': { description: OK } } }
  /backup-runs:
    get: { summary: List recent backup runs recorded by backup.sh, responses: { '200': { description: OK } } }
  /mail-jobs/{id}/retry:
    post: { summary: Requeue a failed or expired email OTP job (step-up required), responses: { '200': { description: OK } } }
  /changelog:
    get: { summary: List changelog entries (max 200 newest), responses: { '200': { description: OK } } }
    post:
      summary: Create changelog entry (step-up required)
      requestBody: { content: { application/json: { schema: { type: object, required: [date, title], properties: { date: { type: string, format: date }, version_tag: { type: string }, title: { type: string }, body: { type: string }, is_published: { type: boolean } } } } } }
      responses: { '201': { description: Created } }
  /changelog/{id}:
    post: { summary: Update changelog entry (step-up required), responses: { '200': { description: OK } } }
    delete: { summary: Delete changelog entry (step-up required), responses: { '200': { description: Deleted } } }
  /changelog/{id}/publish:
    post: { summary: Publish entry to the public timeline (step-up required), responses: { '200': { description: OK } } }
  /changelog/{id}/unpublish:
    post: { summary: Withdraw entry from the public timeline (step-up required), responses: { '200': { description: OK } } }
  /mailbox/inbound:
    get: { summary: List inbound email (max 100, newest first), responses: { '200': { description: OK } } }
  /mailbox/inbound/{id}/read:
    post: { summary: Mark inbound email as read, responses: { '200': { description: OK } } }
  /mailbox/inbound/{id}/reply:
    post:
      summary: Reply with the selected branded template and original message threading
      description: Requires recent MFA and a stable Idempotency-Key. Delivery intent is audited before SMTP; replay never sends twice.
      parameters: [{ $ref: '#/components/parameters/MailIdempotency' }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { body: { type: string }, to: { type: string, format: email }, subject: { type: string }, template: { type: string, enum: [support_reply, product_update, account_notice] }, recipient_name: { type: string, maxLength: 60 }, include_original: { type: boolean, default: false } } } } } }
      responses:
        '200': { description: Accepted by SMTP and recorded. }
        '202': { description: Delivery is in progress or unconfirmed; inspect history before starting another request. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { description: SMTP rejected or failed the submission. }
        '503': { $ref: '#/components/responses/Unavailable' }
  /mailbox/inbound/{id}:
    delete: { summary: Delete inbound email (step-up required), responses: { '200': { description: Deleted } } }
  /mailbox/send:
    post:
      summary: Send a branded administrative message
      description: Requires recent MFA and a stable Idempotency-Key. Delivery intent is audited before SMTP; replay never sends twice.
      parameters: [{ $ref: '#/components/parameters/MailIdempotency' }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { body: { type: string }, to: { type: string, format: email }, subject: { type: string }, template: { type: string, enum: [support_reply, product_update, account_notice] }, recipient_name: { type: string, maxLength: 60 }, include_original: { type: boolean, default: false } } } } } }
      responses:
        '200': { description: Accepted by SMTP and recorded. }
        '202': { description: Delivery is in progress or unconfirmed; inspect history before starting another request. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { description: SMTP rejected or failed the submission. }
        '503': { $ref: '#/components/responses/Unavailable' }
  /mailbox/outbound:
    get: { summary: List outbound email history, responses: { '200': { description: OK } } }
  /mailbox/feedback:
    get: { summary: List user feedback messages, responses: { '200': { description: OK } } }
  /mailbox/feedback/{id}/read:
    post: { summary: Mark feedback as read, responses: { '200': { description: OK } } }
  /mailbox/feedback/{id}/archive:
    post: { summary: Archive feedback (step-up required), responses: { '200': { description: OK } } }
  /mailbox/feedback/{id}/reply:
    post:
      summary: Reply to feedback using the selected branded template
      description: Requires recent MFA and a stable Idempotency-Key. Delivery intent is audited before SMTP; replay never sends twice.
      parameters: [{ $ref: '#/components/parameters/MailIdempotency' }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { body: { type: string }, to: { type: string, format: email }, subject: { type: string }, template: { type: string, enum: [support_reply, product_update, account_notice] }, recipient_name: { type: string, maxLength: 60 }, include_original: { type: boolean, default: false } } } } } }
      responses:
        '200': { description: Accepted by SMTP and recorded. }
        '202': { description: Delivery is in progress or unconfirmed; inspect history before starting another request. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { description: SMTP rejected or failed the submission. }
        '503': { $ref: '#/components/responses/Unavailable' }
  /mailbox/preview:
    post:
      summary: Preview branded content without sending
      description: Session, Origin and CSRF are required; recent MFA is not required because this endpoint does not deliver or save mail.
      responses: { '200': { description: Shared formatted HTML/plain text and view model. }, '400': { $ref: '#/components/responses/BadRequest' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /mailbox/outbound/{id}:
    get:
      summary: Read the immutable prepared message snapshot; legacy mail is marked as plain text
      responses: { '200': { description: Mail detail. }, '404': { description: Mail not found. } }
components:
  securitySchemes:
    administratorSession:
      type: apiKey
      in: cookie
      name: __Host-flowriver-admin
  parameters:
    MailIdempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    Origin:
      name: Origin
      in: header
      required: true
      schema: { type: string, const: 'https://admin.flowriver.xyz' }
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Request is invalid
    Forbidden:
      description: Source, CSRF check, or step-up verification was rejected
    Unauthorized:
      description: Administrator session or credentials were not accepted
    Throttled:
      description: Login or MFA attempts exceeded the current per-source limit
    Unavailable:
      description: Database unavailable
