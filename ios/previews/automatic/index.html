<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>河流日记 · 设计对照与原生实现</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eaf0f5;color:#293b51;font-family:-apple-system,"PingFang SC",sans-serif}main{max-width:1040px;margin:auto;padding:28px 22px}h1{font-size:23px;margin:0 0 10px}p{font-size:13px;line-height:1.8;color:#60748e;margin:8px 0}nav{display:flex;gap:9px;flex-wrap:wrap;margin:22px 0}button,a.link{border:0;background:#eaf0f5;color:#60748e;font:inherit;font-size:13px;padding:12px 20px;border-radius:16px;box-shadow:5px 5px 12px #bbc8d680,-5px -5px 12px #fff;cursor:pointer}button[aria-selected=true]{color:#477de0;box-shadow:inset 3px 3px 7px #c3cedd,inset -3px -3px 7px #fff}a{color:#477de0;text-decoration:none}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:26px}figure{margin:0;min-width:0}figcaption{font-size:14px;font-weight:600;margin:0 0 12px}.phone{border-radius:27px;overflow:auto;height:min(77vh,820px);background:#eaf0f5;box-shadow:9px 11px 22px #afbed05c,-8px -8px 20px #fff;border:3px solid #fff7}.phone img{width:100%;display:block}#detail{margin-top:20px}.notes{margin-top:25px}@media(max-width:620px){main{padding:22px 16px}.comparison{gap:15px}.phone{border-radius:18px;height:68vh}button{padding:11px 13px}h1{font-size:20px}figcaption{font-size:12px}}</style></head>
<body><main><h1>按你的五页设计落实到 iOS</h1><p>左侧：new design ios 原图。右侧：当前 SwiftUI 原生截图。本轮直接采用原始 HTML 的底色、同色卡片与双向阴影；足迹卡片仅保留原图的浅渐变。</p><p>顶部只保留统一品牌与全局日期；页面标题与说明随内容滚动。自动记录是主线，补充与纠正可选。</p><p><a href="../../../samples/ios-redesign/#trail">体验页面与拟态交互动效 ↗</a></p><nav role="tablist" aria-label="五页设计对照"></nav><div class="comparison"><figure><figcaption>你提供的原始设计</figcaption><div class="phone" id="original"><img alt="原始设计"></div></figure><figure><figcaption>对应的原生 iOS 页面</figcaption><div class="phone" id="native"><img alt="原生页面"></div></figure></div><p id="detail"></p><p><a id="timeline-preview" href="trail-timeline.png" hidden>查看原生足迹时间线截图 ↗</a></p><p><a id="answer-preview" href="river-answer.png" hidden>查看原生对话与依据截图 ↗</a></p><div class="notes"><a class="link" href="../../../samples/ios-redesign/#mine">打开 iOS 交互样本 ↗</a><p>原生截图使用隔离 QA 数据。真实定位、健康权限、后台采集与模型连接仍需真机验证。档案数量、时间和候选项来自数据，不复制原图的虚构数字。</p></div></main>
<script>const pages=[['today','今天','自动小结 → 四张功能卡 → 一句诗；采集依据与时间分布来自自动记录。'],['trail','足迹','地图 → 时间线标题 → 待确认提示 → 连续细轴与生活片段。来源通过点开查看，搜索分类收进筛选入口，全天手记与健康默认折叠。'],['pending','待确认','线索与依据 → 卡片内选择或自定义 → 跳过 / 确认收录；决定保存到现有共享状态。'],['river','River','智能伴随卡 → 建议问题 → 对话与来源卡 → 底部输入；使用现有本机检索与授权 AI。'],['mine','我的','资料 → 档案统计 → Projects / Places / People / Habits → 习惯与回顾 → 生活编年史导出。']];const nav=document.querySelector('nav');for(const [id,title]of pages){const button=document.createElement('button');button.textContent=title;button.dataset.page=id;button.role='tab';button.onclick=()=>select(id);nav.append(button)}function select(id){const page=pages.find(x=>x[0]===id)||pages[4];for(const button of nav.children)button.setAttribute('aria-selected',String(button.dataset.page===page[0]));document.querySelector('#original img').src='references/'+page[0]+'.png';document.querySelector('#native img').src=page[0]+'.png?v=scrolling-heading-20261015';document.querySelector('#detail').textContent=page[2];document.querySelector('#timeline-preview').hidden=page[0]!=='trail';document.querySelector('#answer-preview').hidden=page[0]!=='river';for(const phone of document.querySelectorAll('.phone'))phone.scrollTop=0;location.hash=page[0]}select(location.hash.slice(1)||'mine');</script></body></html>
